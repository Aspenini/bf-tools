[package]
name = "cranium-lang"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Cranium: a small structured programming language that compiles to Brainfuck"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["brainfuck", "compiler", "language", "esolang", "cranium"]
categories = ["command-line-utilities", "compilers"]

[dependencies]
# The interpreter behind `--run`, and the tests that execute generated
# Brainfuck to check it. The workspace takes it without its command-line half.
lobe.workspace = true

# The package is `cranium-lang` because `cranium` is taken by an unrelated
# crate. The library and the command keep the language's name.
[lib]
name = "cranium"
path = "src/lib.rs"

[[bin]]
name = "cranium"
path = "src/main.rs"
