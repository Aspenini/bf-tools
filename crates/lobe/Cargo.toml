[package]
name = "lobe"
version = "0.1.5"
edition = "2021"
authors.workspace = true
description = "A fast, cross-platform Brainfuck interpreter written in Rust"
license.workspace = true
repository.workspace = true
keywords = ["brainfuck", "interpreter", "esolang", "bytecode", "lobe"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
# Only the `lobe` command parses arguments. Embedders get the interpreter
# without an argument parser by turning default features off.
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "lobe"
path = "src/main.rs"
required-features = ["cli"]

